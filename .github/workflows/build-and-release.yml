name: Build & Release WinAmpDroid

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APKs & Bundle
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build_debug.log || (echo "### Gradle Build Debug Failed" >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && tail -n 80 build_debug.log >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && exit 1)

      - name: Build Release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build_release.log || (echo "### Gradle Build Release Failed" >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && tail -n 80 build_release.log >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && exit 1)

      - name: Build Release AAB (Google Play Bundle)
        run: |
          set -o pipefail
          ./gradlew bundleRelease --stacktrace 2>&1 | tee build_bundle.log || (echo "### Gradle Build Bundle Failed" >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && tail -n 80 build_bundle.log >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && exit 1)

      - name: Prepare Release Assets
        run: |
          mkdir -p dist
          find app/build -type f -name "*debug*.apk" -exec cp -v {} dist/WinAmpDroid-v1.0.0-debug.apk \; || true
          find app/build -type f -name "*release*.apk" -exec cp -v {} dist/WinAmpDroid-v1.0.0-release.apk \; || true
          find app/build -type f -name "*.aab" -exec cp -v {} dist/WinAmpDroid-v1.0.0-release.aab \; || true
          echo "=== DIST CONTENTS ==="
          ls -la dist/

      - name: Upload Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinAmpDroid-Binaries
          path: dist/*
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: WinAmpDroid ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

